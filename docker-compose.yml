version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    platform: linux/amd64
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin_miboo
      MYSQL_USER: miboodb
      MYSQL_PASSWORD: '!M1bo0.2025#Htyf567KJH'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
